[project]
name = "footprint"
version = "0.1.0"
description = "OSINT footprint aggregator for pentesters and investigators"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["osint", "recon", "pentesting", "cybersecurity"]
dependencies = [
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "dnspython>=2.6.0",
    "python-whois>=0.9.0",
]

[project.scripts]
footprint = "footprint.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["footprint"]
